<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Motion Mate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f5f7f4"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
    <link
      rel="apple-touch-icon"
      href="/icon-192.png"
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Motion Mate is a fitness tracking web application that helps you set and achieve your fitness goals through personalized exercises and progress tracking."
    />

    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="Motion Mate"
    />
    <meta
      property="og:title"
      content="Motion Mate"
    />
    <meta
      property="og:description"
      content="Motion Mate is a fitness tracking web application that helps you set and achieve your fitness goals through personalized exercises and progress tracking."
    />
    <meta
      property="og:url"
      content="%VITE_SITE_URL%/"
    />
    <meta
      property="og:image"
      content="%VITE_SITE_URL%/icon-512.png"
    />

    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'sunset'
            : 'fantasy');
      } catch {
        document.documentElement.dataset.theme = 'fantasy';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
